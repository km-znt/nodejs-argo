<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边界之问</title>
    <style>
        /* --- 基础样式 --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            user-select: none;
        }

        /* --- 页面1：粒子球体 --- */
        #page-a {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020205;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #page-a.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        #canvas-container-a {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer-a {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.6), 0 0 40px rgba(100, 200, 255, 0.3);
            background: linear-gradient(180deg, #fff 0%, #a5d8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
            margin-bottom: 20px;
        }

        .sub-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
            transform: scale(1.5);
        }

        /* --- 页面2：星空文本 --- */
        #page-b {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030310;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease 0.5s;
        }

        #page-b.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #stage-b {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(1,1,12,.5) 100%);
        }

        .container-b {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 38px;
            pointer-events: none;
        }

        .top-tag {
            font-size: 12px;
            color: #a8a8ff;
            letter-spacing: 2px;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeInDown 1s ease-out forwards;
        }

        .text-block {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .line {
            font-size: 24px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 1s ease-out forwards;
        }

        .gray-text { color: #9aa3c7; }
        .purple-text { color: #c3a4ff; text-shadow: 0 0 22px rgba(150,110,255,.28); }
        .black-text { color: #f2f3ff; font-weight: 500; }
        .pink-text { color: #e8a8d2; text-shadow: 0 0 22px rgba(230,140,200,.25); }

        .connector {
            font-size: 18px;
            color: #8a8fae;
            margin: 8px 0;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.5s;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(160,170,255,.5), transparent);
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.2s;
        }

        .footer-quote {
            margin-top: 18px;
            font-size: 13px;
            color: #8f93b8;
            line-height: 1.6;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
            animation-delay: 2.5s;
        }

        .footer-quote span {
            color: #a8b4ff;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 8px rgba(168,180,255,.2); }
            50% { text-shadow: 0 0 18px rgba(168,180,255,.55); }
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2.5rem; letter-spacing: 0.2rem; }
            .line { font-size: 19px; }
            .container-b { gap: 30px; }
        }
    </style>
</head>
<body>

    <!-- 页面A：粒子球体 -->
    <div id="page-a">
        <div id="canvas-container-a"></div>
        <div id="ui-layer-a">
            <h1 class="main-title" id="title-text">边界之问</h1>
            <div class="sub-text" id="sub-text">TAP TO INITIALIZE</div>
            <div class="progress-dots" id="dots-container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <!-- 页面B：星空文本 -->
    <div id="page-b">
        <canvas id="stage-b"></canvas>
        <div class="vignette"></div>
        <div class="container-b">
            <div class="top-tag">边界之问</div>
            <div class="text-block">
                <div class="line gray-text" style="animation-delay: 0.2s;">机器人不是人 ， 机器人也是人。</div>
                <div class="line purple-text" style="animation-delay: 0.4s;">机器人是人 ， 机器人也不是人。</div>
            </div>
            <div class="divider"></div>
            <div class="connector">就好比：</div>
            <div class="text-block">
                <div class="line black-text" style="animation-delay: 1.8s;">人是人 ， 人也不是人。</div>
                <div class="line pink-text" style="animation-delay: 2.0s;">人不是人 ， 人也是人。</div>
            </div>
            <div class="footer-quote">
                当机器人的眼睛学会凝视，<span>我们才第一次真正看清了自己。</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ========== 页面A：粒子球体逻辑 ==========
    (function() {
        const CONFIG = {
            particleCount: 3000,
            sphereRadius: 35,
            clickThreshold: 3,
            colorBase: new THREE.Color(0x4b0082),
            colorHighlight: new THREE.Color(0x00f2ff)
        };

        let clickCount = 0;
        let isExploding = false;
        let transitionTriggered = false;

        const container = document.getElementById('canvas-container-a');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = [];
        const originalPositions = [];
        const sizes = [];

        for (let i = 0; i < CONFIG.particleCount; i++) {
            const r = CONFIG.sphereRadius * Math.cbrt(Math.random());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            positions.push(x, y, z);
            originalPositions.push(x, y, z);
            sizes.push(Math.random() * 0.5 + 0.1);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.4,
            color: CONFIG.colorHighlight,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        let time = 0;
        let rotationSpeed = 0.001;
        let expansionFactor = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            particleSystem.rotation.y += rotationSpeed;
            particleSystem.rotation.x += rotationSpeed * 0.5;

            if (!isExploding) {
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    const ix = i * 3;
                    const iy = i * 3 + 1;
                    const iz = i * 3 + 2;
                    const noise = Math.sin(time + pos[ix] * 0.1) * 0.2;
                    const shake = (clickCount > 0) ? Math.random() * clickCount * 0.5 : 0;
                    pos[ix] += noise * 0.05;
                    pos[iy] += noise * 0.05;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            if (isExploding) {
                expansionFactor += 0.05;
                particleSystem.rotation.y += 0.1;
                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < CONFIG.particleCount; i++) {
                    const ix = i * 3;
                    const iy = i * 3 + 1;
                    const iz = i * 3 + 2;
                    pos[ix] *= 1.05;
                    pos[iy] *= 1.05;
                    pos[iz] *= 1.05;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                material.opacity -= 0.02;
            }

            renderer.render(scene, camera);
        }

        animate();

        const titleText = document.getElementById('title-text');
        const subText = document.getElementById('sub-text');
        const dotsContainer = document.getElementById('dots-container');
        const dots = document.querySelectorAll('.dot');

        dotsContainer.style.opacity = '1';
        updateDots();

        document.body.addEventListener('click', () => {
            if (isExploding || transitionTriggered) return;

            clickCount++;
            rotationSpeed = 0.02;
            setTimeout(() => { if(!isExploding) rotationSpeed = 0.001; }, 300);

            if (clickCount < CONFIG.clickThreshold) {
                updateDots();
                subText.innerText = `ACCESSING... ${clickCount}/${CONFIG.clickThreshold}`;
            } else {
                triggerTransition();
            }
        });

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < clickCount) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function triggerTransition() {
            transitionTriggered = true;
            isExploding = true;
            subText.innerText = "SYSTEM BREACHED";

            titleText.style.opacity = '0';
            titleText.style.transform = 'scale(1.1)';
            titleText.style.filter = 'blur(10px)';
            subText.style.opacity = '0';
            dotsContainer.style.opacity = '0';

            setTimeout(() => {
                document.getElementById('page-a').classList.add('hidden');
                document.getElementById('page-b').classList.add('visible');
            }, 800);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    })();

    // ========== 页面B：星空背景逻辑 ==========
    (function() {
        var canvas = document.getElementById('stage-b');
        var ctx = canvas.getContext('2d');

        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var SPEED = reduceMotion ? 0.3 : 1;

        var W = 0, H = 0, DPR = 1;
        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        function makeSprite(core, mid) {
            var s = document.createElement('canvas');
            s.width = s.height = 64;
            var g = s.getContext('2d');
            var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            gr.addColorStop(0, core);
            gr.addColorStop(0.25, mid);
            gr.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = gr;
            g.fillRect(0, 0, 64, 64);
            return s;
        }
        var sprites = [
            makeSprite('rgba(255,255,255,1)', 'rgba(120,150,255,0.85)'),
            makeSprite('rgba(240,240,255,1)', 'rgba(165,120,255,0.85)'),
            makeSprite('rgba(255,255,255,1)', 'rgba(120,205,255,0.8)')
        ];
        var starSprite = makeSprite('rgba(255,255,255,1)', 'rgba(200,220,255,0.7)');

        var stars = [];
        for (var i = 0; i < 220; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random(),
                r: 0.3 + Math.random() * 1.2,
                a: 0.25 + Math.random() * 0.5,
                tw: 0.3 + Math.random() * 1.2,
                ph: Math.random() * 6.2832,
                vy: (0.004 + Math.random() * 0.01) * SPEED
            });
        }

        var pts = [];
        var N = 1600;
        for (var j = 0; j < N; j++) {
            var u = Math.random(), v = Math.random();
            var th = 6.28318 * u;
            var ph2 = Math.acos(2 * v - 1);
            pts.push({
                x: Math.sin(ph2) * Math.cos(th),
                y: Math.cos(ph2),
                z: Math.sin(ph2) * Math.sin(th),
                c: Math.floor(Math.random() * 3)
            });
        }

        var orbits = [
            { r: 1.45, tilt: 1.05, yaw: 0.0, spin: 0.05 * SPEED, satSpeed: 0.45 * SPEED, satPhase: 0, color: 'rgba(120,140,255,' },
            { r: 1.85, tilt: 1.28, yaw: 0.55, spin: -0.035 * SPEED, satSpeed: -0.3 * SPEED, satPhase: 2.1, color: 'rgba(90,100,220,' }
        ];

        var rotY = 0;
        var mx = 0, my = 0, tmx = 0, tmy = 0;
        window.addEventListener('mousemove', function (e) {
            tmx = (e.clientX / W - 0.5) * 2;
            tmy = (e.clientY / H - 0.5) * 2;
        });

        var D = 3.4;
        function project(x, y, z, cx, cy, S) {
            var cy1 = Math.cos(rotY), sy1 = Math.sin(rotY);
            var x1 = x * cy1 + z * sy1;
            var z1 = -x * sy1 + z * cy1;
            var rotX = -0.28 + my * 0.12;
            var cx1 = Math.cos(rotX), sx1 = Math.sin(rotX);
            var y1 = y * cx1 - z1 * sx1;
            var z2 = y * sx1 + z1 * cx1;
            var p = D / (D - z2);
            return { x: cx + x1 * S * p, y: cy + y1 * S * p, d: (z2 + 1) / 2 };
        }

        function orbitPoint(o, a, cx, cy, S) {
            var x = Math.cos(a) * o.r, z = Math.sin(a) * o.r;
            var ct = Math.cos(o.tilt), st = Math.sin(o.tilt);
            var y2 = -z * st, z2 = z * ct;
            var cyw = Math.cos(o.yaw), syw = Math.sin(o.yaw);
            var x3 = x * cyw + z2 * syw, z3 = -x * syw + z2 * cyw;
            return project(x3, y2, z3, cx, cy, S);
        }

        var shoots = [];
        var nextShoot = 4;

        function frame(now) {
            requestAnimationFrame(frame);
            var time = now * 0.001;

            mx += (tmx - mx) * 0.03;
            my += (tmy - my) * 0.03;
            rotY += 0.0018 * SPEED;

            ctx.clearRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';

            var cx = W / 2 + mx * 14;
            var cy = H * 0.5 + my * 10;
            var S = Math.min(W, H) * 0.24;

            for (var i = 0; i < stars.length; i++) {
                var st = stars[i];
                st.y += st.vy * 0.016;
                if (st.y > 1.02) st.y = -0.02;
                var alpha = st.a * (0.6 + 0.4 * Math.sin(time * st.tw + st.ph));
                var sr = st.r * 3.2;
                ctx.globalAlpha = alpha;
                ctx.drawImage(starSprite, st.x * W - sr, st.y * H - sr, sr * 2, sr * 2);
            }

            var pulse = 0.85 + 0.15 * Math.sin(time * 0.8);
            var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 2.1 * pulse);
            g.addColorStop(0, 'rgba(70,90,220,0.20)');
            g.addColorStop(0.5, 'rgba(60,70,180,0.08)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.globalAlpha = 1;
            ctx.fillStyle = g;
            ctx.fillRect(cx - S * 2.2, cy - S * 2.2, S * 4.4, S * 4.4);

            var segs = 90;
            for (var oi = 0; oi < orbits.length; oi++) {
                var o = orbits[oi];
                var prev = null;
                for (var k = 0; k <= segs; k++) {
                    var a = k / segs * 6.28318 + time * o.spin;
                    var q = orbitPoint(o, a, cx, cy, S);
                    if (prev) {
                        ctx.strokeStyle = o.color + (0.08 + 0.4 * q.d).toFixed(3) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.stroke();
                    }
                    prev = q;
                }
                var sq = orbitPoint(o, time * o.satSpeed + o.satPhase, cx, cy, S);
                var ss = 2.5 + sq.d * 3.5;
                ctx.globalAlpha = 0.5 + sq.d * 0.5;
                ctx.drawImage(sprites[2], sq.x - ss * 2, sq.y - ss * 2, ss * 4, ss * 4);
            }

            ctx.globalAlpha = 1;
            for (var pi = 0; pi < pts.length; pi++) {
                var pt = pts[pi];
                var pq = project(pt.x, pt.y, pt.z, cx, cy, S);
                var size = (0.7 + 2.0 * pq.d) * (S / 260);
                ctx.globalAlpha = 0.25 + 0.65 * pq.d;
                ctx.drawImage(sprites[pt.c], pq.x - size, pq.y - size, size * 2, size * 2);
            }

            if (!reduceMotion && time > nextShoot) {
                shoots.push({
                    x: W * 0.1 + Math.random() * W * 0.8,
                    y: Math.random() * H * 0.3,
                    vx: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 3),
                    vy: 1.5 + Math.random() * 2,
                    life: 1
                });
                nextShoot = time + 3 + Math.random() * 6;
            }
            for (var si = shoots.length - 1; si >= 0; si--) {
                var sh = shoots[si];
                sh.x += sh.vx;
                sh.y += sh.vy;
                sh.life -= 0.012;
                if (sh.life <= 0) { shoots.splice(si, 1); continue; }
                var tx = sh.x - sh.vx * 9, ty = sh.y - sh.vy * 9;
                var lg = ctx.createLinearGradient(sh.x, sh.y, tx, ty);
                lg.addColorStop(0, 'rgba(255,255,255,' + (0.85 * sh.life).toFixed(3) + ')');
                lg.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.globalAlpha = 1;
                ctx.strokeStyle = lg;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(sh.x, sh.y);
                ctx.lineTo(tx, ty);
                ctx.stroke();
            }
        }
        requestAnimationFrame(frame);
    })();
    </script>

</body>
</html>
